<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main>
      <div class="input"> 
        <h1>0</h1>
      </div>

      <div class="button-container">
       
        
        
        <button class="backspace"> ⌫</button>
        <button class="percentage operator">%</button>
        <button class="clear">C</button>
        
        <button class="equal-to">=</button>

        <button class="operand">7</button>
        <button class="operand">8</button>
        <button class="operand">9</button>
        <button class="add operator">+</button>
        
        <button class="operand">4</button>
        <button class="operand">5</button>
        <button class="operand">6</button>
        <button class="subtract operator">−</button>
        
        <button class="operand">1</button>
        <button class="operand">2</button>
        <button class="operand">3</button>
        <button class="multiply operator">×</button>

        <button class=""> .</button>
        <button class="operand">0</button>
        <button class="sqrt operator"> √x </button>
        <button class="divide operator">÷</button>
        
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
