<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main>
      <div class="input"> 
        <h1>2+2</h1>
      </div>

      <div class="button-container">
       
        
        
        <button class="backspace"> ⌫</button>
        <button class="percentage operator">%</button>
        <button class="clear">C</button>
        
        <button class="equal-to operator">=</button>

        <button class="">7</button>
        <button class="">8</button>
        <button class="">9</button>
        <button class="addition operator">+</button>
        
        <button class="">4</button>
        <button class="">5</button>
        <button class="">6</button>
        <button class="subtraction operator">−</button>
        
        <button class="">1</button>
        <button class="">2</button>
        <button class="">3</button>
        <button class="multiplication operator"> × </button>

        <button class=""> .</button>
        <button class="">0</button>
        <button class="sqrt operator"> √x </button>
        <button class="division operator">÷</button>
        
        <!-- <button class=""></button> -->
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
